spring:
  application:
    name: accesscontrol
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:storeyes-blue}?sslmode=verify-full&sslrootcert=${POSTGRES_SSL_ROOT_CERT:./global-bundle.pem}
    username: ${POSTGRES_USER:storeyes}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_schema: demo
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    schemas: demo
    default-schema: demo
  servlet:
    multipart:
      # Disabled on purpose: Hikvision terminals half-close the socket / overstate Content-Length,
      # so the eager resolver 400'd every push before DeviceEventController ran. The controller now
      # reads and splits the multipart body itself (see its class javadoc).
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

# Hikvision device push notifications (POST /api/device-events). Devices carry no X-STORE-CODE,
# so every event is attributed to this tenant until a device registry exists.
device:
  ingest:
    tenant: ${DEVICE_INGEST_TENANT:lendys}
    enabled: ${DEVICE_INGEST_ENABLED:true}
    shared-secret: ${DEVICE_INGEST_SECRET:}

logging:
  level:
    org.springframework.web: DEBUG
    io.storeyes.accesscontrol: DEBUG
